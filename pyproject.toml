[project]
name = "itvp20iot1"
version = "1.2.0"
description = "Hanzehogeschool IOT Workshop"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "furo>=2025.12.19",
    "myst-nb>=1.4.0",
    "myst-parser>=5.0.0",
    "sphinx>=9.1.0",
    "sphinx-design>=0.7.0",
    "sphinx-exercise>=1.2.1",
    "sphinx-external-toc>=1.1.0",
    "sphinx-immaterial>=0.13.9",
    "sphinxcontrib-bibtex>=2.6.5",
    "sphinxcontrib-video>=0.4.2",
]

[tool.uv]
upgrade = true
python-preference = "only-system"

[dependency-groups]
dev = [
    "sphinx-autobuild>=2025.8.25",
]
